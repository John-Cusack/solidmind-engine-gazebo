[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solidmind-engine-gazebo"
version = "0.1.0"
description = "Gazebo engine for SolidMind — package→SDF compilation, PX4 SITL, 5-DOF teleop."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The conformance kit's schema tier is the only thing that needs a dependency.
tck = ["jsonschema>=4.10,<5"]
# Pinned exactly, and CI installs the same version — see
# .github/workflows/ci.yml. A range lets a ruff release redden main
# overnight on a commit that changed nothing.
dev = ["ruff==0.16.1"]

[tool.setuptools]
packages = ["gazebo_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled by formatter
  "UP042", # keep the `class X(str, Enum)` convention core uses: switching to
           # StrEnum changes str(member) output ("X.PASS" -> "pass"), which
           # would silently alter logging and JSON serialization — and the
           # vendored conformance kit has to behave exactly as core's does.
]
